<!-- ========================================
  HYTOPIA SDK-COMPLIANT MOBILE CONTROLS
  Six-Seven - Rhythm Party Game (Jump on the Beat!)

  Based on HYTOPIA_MOBILE_CONTROLS_GUIDE.md
======================================== -->

<div class="mobile-controls" id="mobile-controls">
  <!-- Single large JUMP button - critical for rhythm game -->
  <div class="mobile-center-controls">
    <button id="mobile-jump-btn" class="mobile-btn jump-btn mega-button" aria-label="Jump">
      <span class="btn-icon">&#x1F3B5;</span>
      <span class="btn-label">JUMP!</span>
    </button>
  </div>

  <!-- Beat indicator -->
  <div class="beat-indicator" id="beat-indicator">
    <div class="beat-text">TAP ON THE BEAT!</div>
    <div class="beat-rings">
      <div class="beat-ring ring-1"></div>
      <div class="beat-ring ring-2"></div>
      <div class="beat-ring ring-3"></div>
    </div>
  </div>
</div>

<style>
  .mobile-controls { display: none; }

  body.mobile .mobile-controls,
  body.mobile.gameplay-active .mobile-controls {
    display: block;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2000;
  }

  body.mobile .mobile-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.65);
    border: 4px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(8px);
    color: white;
    pointer-events: auto;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  body.mobile .mobile-btn:active,
  body.mobile .mobile-btn.active {
    transform: scale(0.92);
  }

  body.mobile .btn-icon { margin-bottom: 5px; }
  body.mobile .btn-label { font-weight: 800; letter-spacing: 2px; }

  /* Center position for rhythm game */
  body.mobile .mobile-center-controls {
    position: fixed;
    bottom: 80px;
    right: 40px;
  }

  /* MEGA JUMP BUTTON - Extra large for rhythm game */
  body.mobile .mega-button {
    width: 120px;
    height: 120px;
    background: linear-gradient(145deg, rgba(255, 50, 150, 0.9), rgba(200, 30, 120, 0.95));
    border-color: rgba(255, 150, 200, 0.7);
    box-shadow: 0 0 30px rgba(255, 50, 150, 0.4);
  }

  body.mobile .mega-button .btn-icon { font-size: 40px; }
  body.mobile .mega-button .btn-label { font-size: 16px; }

  body.mobile .mega-button.active {
    background: linear-gradient(145deg, rgba(255, 100, 180, 0.95), rgba(255, 50, 150, 0.95));
    box-shadow: 0 0 60px rgba(255, 50, 150, 0.8), 0 0 100px rgba(255, 150, 200, 0.4);
  }

  /* Beat indicator */
  body.mobile .beat-indicator {
    position: fixed;
    bottom: 220px;
    right: 40px;
    width: 120px;
    text-align: center;
    pointer-events: none;
  }

  .beat-text {
    color: white;
    font-size: 12px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    margin-bottom: 10px;
    animation: pulse 0.5s ease infinite;
  }

  .beat-rings {
    position: relative;
    width: 60px;
    height: 60px;
    margin: 0 auto;
  }

  .beat-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px solid rgba(255, 50, 150, 0.6);
  }

  .ring-1 { width: 20px; height: 20px; animation: ringPulse 1s ease infinite; }
  .ring-2 { width: 40px; height: 40px; animation: ringPulse 1s ease 0.2s infinite; }
  .ring-3 { width: 60px; height: 60px; animation: ringPulse 1s ease 0.4s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  @keyframes ringPulse {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  }

  @media (max-height: 500px) {
    body.mobile .mega-button { width: 100px; height: 100px; }
    body.mobile .mega-button .btn-icon { font-size: 32px; }
    body.mobile .mega-button .btn-label { font-size: 14px; }
  }
</style>

<script>
(function() {
  'use strict';
  const isMobile = document.body.classList.contains('mobile') || (window.hytopia && window.hytopia.isMobile);
  if (!isMobile) return;

  function setupJumpButton() {
    const btn = document.getElementById('mobile-jump-btn');
    if (!btn) return;
    let pressed = false, touchId = null;

    function press(tid) {
      if (pressed) return;
      pressed = true; touchId = tid;
      btn.classList.add('active');
      if (window.hytopia?.pressInput) window.hytopia.pressInput('sp', true);
      // Tap behavior for jump
      setTimeout(() => release(tid), 200);
    }

    function release(tid) {
      if (!pressed || (tid !== undefined && tid !== touchId)) return;
      pressed = false; touchId = null;
      btn.classList.remove('active');
      if (window.hytopia?.pressInput) window.hytopia.pressInput('sp', false);
    }

    btn.addEventListener('touchstart', e => { e.preventDefault(); press(e.changedTouches[0].identifier); }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); for (const t of e.changedTouches) if (t.identifier === touchId) release(t.identifier); }, { passive: false });
    btn.addEventListener('touchcancel', e => { for (const t of e.changedTouches) if (t.identifier === touchId) release(t.identifier); }, { passive: false });
    btn.addEventListener('mousedown', e => { e.preventDefault(); press(-1); });
    btn.addEventListener('mouseup', () => release(-1));
    btn.addEventListener('mouseleave', () => { if (pressed) release(-1); });
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }

  setTimeout(setupJumpButton, 100);
})();
</script>
